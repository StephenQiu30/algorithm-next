name: Teaching platform checks
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run course:check
      - run: npm run build
      - run: npm install --global agent-browser@0.33.0
      - run: agent-browser install --with-deps
      - name: Browser smoke checks
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3111 > /tmp/sorting-next.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3111/sorting/bubble > /dev/null; then break; fi
            sleep 1
          done
          bash tests/browser-smoke.sh
